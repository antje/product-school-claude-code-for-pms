<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="960" height="520" fill="#fcfcfb"/>
  <text x="40" y="44" font-size="22" font-weight="600" fill="#0b0b0b">4.2 made each miss cost less rank, and made misses three times as common</text>
  <text x="40" y="70" font-size="14" fill="#52514e">config.py: proximity weight 0.45 → 0.60, recent-acceptance weight 0.40 → 0.25, timeout 90s → 60s.</text>
  <text x="40" y="88" font-size="14" fill="#52514e">One minute of travel time is 1/45 of the proximity score.</text>

  <!-- left panel: dumbbells, minutes -->
  <text x="40" y="112" font-size="13" font-weight="600" fill="#0b0b0b">What the ranking score is worth, in minutes of travel time</text>
  <circle cx="48" cy="134" r="5" fill="#86b6ef"/><text x="60" y="138" font-size="12" fill="#52514e">before 4.2</text>
  <circle cx="140" cy="134" r="5" fill="#1c5cab"/><text x="152" y="138" font-size="12" fill="#52514e">after 4.2</text>

  <!-- x axis 0..45 min mapped to x=270..590 -->
  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="270" y1="160" x2="270" y2="372"/><line x1="376.7" y1="160" x2="376.7" y2="372"/><line x1="483.3" y1="160" x2="483.3" y2="372"/><line x1="590" y1="160" x2="590" y2="372"/>
  </g>
  <line x1="270" y1="372" x2="590" y2="372" stroke="#c3c2b7" stroke-width="1"/>
  <g font-size="11" fill="#898781" text-anchor="middle">
    <text x="270" y="390">0</text><text x="376.7" y="390">15</text><text x="483.3" y="390">30</text><text x="590" y="390">45 min</text>
  </g>

  <!-- row 1: one miss: 4.8 -> 2.25 -->
  <text x="258" y="188" font-size="12" fill="#0b0b0b" text-anchor="end">Head start one miss hands</text>
  <text x="258" y="204" font-size="12" fill="#52514e" text-anchor="end">a neutral rival</text>
  <line x1="286" y1="196" x2="304.1" y2="196" stroke="#c3c2b7" stroke-width="2"/>
  <circle cx="304.1" cy="196" r="7" fill="#86b6ef" stroke="#fcfcfb" stroke-width="2"/>
  <circle cx="286" cy="196" r="7" fill="#1c5cab" stroke="#fcfcfb" stroke-width="2"/>
  <text x="318" y="200" font-size="12" fill="#0b0b0b">4.8 → 2.25</text>

  <!-- row 2: floored vs neutral: 20 -> 9.4 -->
  <text x="258" y="262" font-size="12" fill="#0b0b0b" text-anchor="end">How much closer a floored responder</text>
  <text x="258" y="278" font-size="12" fill="#52514e" text-anchor="end">must be than a neutral rival</text>
  <line x1="336.8" y1="270" x2="412.2" y2="270" stroke="#c3c2b7" stroke-width="2"/>
  <circle cx="412.2" cy="270" r="7" fill="#86b6ef" stroke="#fcfcfb" stroke-width="2"/>
  <circle cx="336.8" cy="270" r="7" fill="#1c5cab" stroke="#fcfcfb" stroke-width="2"/>
  <text x="426" y="274" font-size="12" fill="#0b0b0b">20 → 9.4</text>

  <!-- row 3: floored vs perfect: 40 -> 18.8 -->
  <text x="258" y="336" font-size="12" fill="#0b0b0b" text-anchor="end">How much closer a floored responder</text>
  <text x="258" y="352" font-size="12" fill="#52514e" text-anchor="end">must be than a perfect-record rival</text>
  <line x1="403.7" y1="344" x2="554.4" y2="344" stroke="#c3c2b7" stroke-width="2"/>
  <circle cx="554.4" cy="344" r="7" fill="#86b6ef" stroke="#fcfcfb" stroke-width="2"/>
  <circle cx="403.7" cy="344" r="7" fill="#1c5cab" stroke="#fcfcfb" stroke-width="2"/>
  <text x="568" y="348" font-size="12" fill="#0b0b0b">40 → 18.8</text>

  <!-- right panel: misses per filled callout -->
  <text x="660" y="112" font-size="13" font-weight="600" fill="#0b0b0b">Misses per filled callout</text>
  <text x="660" y="130" font-size="12" fill="#52514e">callout-history.csv, (sent − taken) ÷ taken</text>
  <!-- y scale 0..1.0 -> y=372..172 -->
  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="700" y1="272" x2="900" y2="272"/><line x1="700" y1="172" x2="900" y2="172"/>
  </g>
  <line x1="700" y1="372" x2="900" y2="372" stroke="#c3c2b7" stroke-width="1"/>
  <g font-size="11" fill="#898781" text-anchor="end"><text x="694" y="376">0</text><text x="694" y="276">0.5</text><text x="694" y="176">1.0</text></g>
  <!-- before 0.30 -> height 60 ; after 0.84 -> height 168 -->
  <path d="M738 372 V316 a4 4 0 0 1 4 -4 h16 a4 4 0 0 1 4 4 V372 Z" fill="#86b6ef"/>
  <path d="M838 372 V208 a4 4 0 0 1 4 -4 h16 a4 4 0 0 1 4 4 V372 Z" fill="#1c5cab"/>
  <text x="750" y="302" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">0.30</text>
  <text x="850" y="194" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">0.84</text>
  <text x="750" y="392" font-size="11" fill="#898781" text-anchor="middle">six weeks before</text>
  <text x="850" y="392" font-size="11" fill="#898781" text-anchor="middle">release week</text>

  <!-- takeaway -->
  <line x1="40" y1="420" x2="920" y2="420" stroke="#e1e0d9"/>
  <text x="40" y="448" font-size="13" fill="#0b0b0b">The rebalance everyone argued about halved the ratchet's bite per miss. The timeout cut nobody argued about tripled the misses.</text>
  <text x="40" y="468" font-size="13" fill="#0b0b0b">From a 0.5 start, five misses reach the 0.0 floor under either set of weights.</text>
  <text x="40" y="500" font-size="11" fill="#898781">Source: 00-rook/code/dispatch-routing/config.py and history.py; 00-rook/data/callout-history.csv. Module 4, Round 1.</text>
</svg>
